# KlubHub Promoter NATS server (JetStream, JWT/NKey auth via MEMORY resolver).
# auth.conf is generated by infra/promoter/nats/generate-creds.sh and mounted
# read-only; the server never sees an NKey seed.
server_name: promoter-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 512M
  max_file_store: 10G
}

include ./auth.conf
