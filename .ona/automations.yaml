tasks:
  installNodeDeps:
    name: Install Node dependencies
    description: Install pnpm workspace dependencies.
    command: pnpm install --frozen-lockfile
    triggeredBy:
      - postDevcontainerStart

  installGoDeps:
    name: Install Go dependencies
    description: Download Go module dependencies for the API.
    command: cd api && go mod download
    triggeredBy:
      - postDevcontainerStart

  setupEnv:
    name: Set up .env file
    description: Copy .env.example to .env if no .env exists. Fill in required secrets before starting services.
    command: |
      if [ ! -f .env ]; then
        cp .env.example .env
        echo "⚠️  .env created from .env.example — set POSTGRES_PASSWORD, Garage S3 credentials, and TOKEN_ENCRYPTION_KEY before starting services."
      fi
    triggeredBy:
      - postDevcontainerStart

  startInfra:
    name: Start infrastructure services
    description: Start PostgreSQL and Garage via Docker Compose (db and storage only; api and frontend run natively).
    command: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    triggeredBy:
      - manual
    dependsOn:
      - setupEnv

services:
  frontend:
    name: Frontend dev server
    description: Nuxt dev server via Nx (hot-reload on port 3000).
    commands:
      start: pnpm nx serve dj
      ready: curl -sf http://localhost:3000

  api:
    name: API dev server
    description: Go API server (port 8080). Requires infrastructure services to be running and .env populated.
    commands:
      start: cd api && go run ./cmd/api
      ready: curl -sf http://localhost:8080/api/v1/health
