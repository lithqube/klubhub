[extend]
useDefault = true

# The credential was committed before this hardening PR. This exception is
# deliberately constrained to both the introducing commit and the one launch
# file; future findings in that path or commit do not match independently.
[[allowlists]]
description = "pre-v1 launch config credential removed and rotated"
condition = "AND"
commits = ["0ee380af4ef7a6ccc737153238bd54b89e8a4d51"]
paths = ['''^\.claude/launch\.json$''']

[[allowlists]]
description = "historical empty Garage variable mistaken for a generic key"
condition = "AND"
commits = ["35a3d6fa56305d7d9114c9cae97aa3f16adce78c"]
paths = ['''^\.planning/phases/00-infrastructure/00-02-PLAN\.md$''']

[[allowlists]]
description = "generated file-manifest SHA hashes mistaken for Discord tokens"
condition = "AND"
commits = ["4e5eff76d5182a9cebac25a3d82ee4864644a592"]
paths = [
  '''^\.claude/gsd-file-manifest\.json$''',
  '''^\.opencode/gsd-file-manifest\.json$''',
]

[[allowlists]]
description = "fake pk_test_ Plunk key fixture in the site build test"
condition = "AND"
commits = ["325583b117fedfa3b0d2b003896e8ad98ac59875"]
paths = ['''^apps/site/site\.test\.mjs$''']
