# Gitleaks — secret scanning gate (CI: .github/workflows/promoter-ci.yml).
# Extends the default ruleset. Allowlisted paths contain fixtures that are
# fake by construction; adding a path here is a review decision.

[extend]
useDefault = true

[allowlist]
description = "Fake test fixtures and templates"
paths = [
  '''apps/site/site\.test\.mjs$''',  # pk_test_… placeholder Plunk key
  '''\.infisical\.example\.json$''',
]
