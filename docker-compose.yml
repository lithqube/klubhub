# docker-compose.yml — KlubHub DJ v1.0.0+ local stack
#
# Same model as docker-compose.prod.yml (single image), tuned for local
# development. Frontend and API live in ONE container; Nuxt's Nitro
# output is embedded at /opt/frontend and proxied by the API at :8080.
# Operators who want a faster UI iteration loop can still run the
# frontend outside Compose with `pnpm nx serve dj` (NUXT_PUBLIC_API_BASE
# unset → mock handlers). See docker-compose.dev.yml.
#
# Required env (or generate via the bootstrap dance in
# docs/container-images.md / docs/SELF-HOSTING.md):
#   POSTGRES_PASSWORD, TOKEN_ENCRYPTION_KEY, ICAL_SECRET,
#   GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
#   S3_ACCESS_KEY, S3_SECRET_KEY (after Garage bootstrap).

name: klubhub-dj

secrets:
  postgres_password:
    file: ${SECRET_DIR:-./secrets}/postgres_password
  garage_rpc_secret:
    file: ${SECRET_DIR:-./secrets}/garage_rpc_secret
  garage_admin_token:
    file: ${SECRET_DIR:-./secrets}/garage_admin_token
  token_encryption_key:
    file: ${SECRET_DIR:-./secrets}/token_encryption_key
  ical_secret:
    file: ${SECRET_DIR:-./secrets}/ical_secret
  s3_access_key:
    file: ${SECRET_DIR:-./secrets}/s3_access_key
  s3_secret_key:
    file: ${SECRET_DIR:-./secrets}/s3_secret_key

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klubhub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-klubhub}
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks: [ internal ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klubhub} -d ${POSTGRES_DB:-klubhub}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  storage:
    image: dxflrs/garage:v2.2.0
    container_name: klubhub-storage
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-39000}:3900"
    volumes:
      - storage_data:/data
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_RPC_SECRET_FILE=/run/secrets/garage_rpc_secret
      - GARAGE_ADMIN_TOKEN_FILE=/run/secrets/garage_admin_token
    secrets:
      - garage_rpc_secret
      - garage_admin_token
    networks: [ internal ]
    stop_grace_period: 30s

  api:
    # Local stack can either pull the published image (IMAGE_REPOSITORY +
    # IMAGE_TAG) or build from source (set LOCAL_BUILD=1).
    image: ${IMAGE_REPOSITORY:-ghcr.io/lithqube/klubhub-dj}:${IMAGE_TAG:-v0.1.0-rc1}
    build:
      context: .
      dockerfile: apps/dj/Dockerfile
      platforms: [linux/arm64]
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klubhub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-klubhub}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
      S3_ENDPOINT: storage:3900
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:39000}
      S3_BUCKET: ${S3_BUCKET:-klubhub}
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      ICAL_SECRET_FILE: /run/secrets/ical_secret
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_SEC: ${SHUTDOWN_TIMEOUT_SEC:-30}
      NUXT_INTERNAL_URL: http://127.0.0.1:3000
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      DISCOGS_API_KEY: ${DISCOGS_API_KEY:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
    secrets:
      - postgres_password
      - token_encryption_key
      - ical_secret
      - s3_access_key
      - s3_secret_key
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    networks: [ internal ]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/api", "-healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 200

volumes:
  db_data:
  storage_data:

networks:
  internal:
    driver: bridge
