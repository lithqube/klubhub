name: klubhub-dj

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: klubhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: klubhub
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    networks: [ internal ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U klubhub -d klubhub" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storage:
    image: dxflrs/garage:v2.2.0
    container_name: klubhub-storage
    ports:
      - "127.0.0.1:39000:3900" # S3 API
      - "39001:3901" # Admin API (internal only)
    volumes:
      - storage_data:/data
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    # Healthcheck omitted: Garage does not support anonymous access,
    # and the S3 API requires authentication for all requests including /.
    # Use 'docker exec klubhub-storage /garage status' to verify manually.
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: klubhub-dj-api:latest
    environment:
      DATABASE_URL: postgres://klubhub:${POSTGRES_PASSWORD}@db:5432/klubhub?sslmode=disable
      # S3 Storage (Garage)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-europe-west-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:39000}
      S3_BUCKET: ${S3_BUCKET:-klubhub}
      # Backward aliases (deprecated, use S3_* vars above)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      DISCOGS_API_KEY: ${DISCOGS_API_KEY:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    networks: [ internal ]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- http://localhost:8080/api/v1/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/dj/Dockerfile
    image: klubhub-dj-frontend:latest
    environment:
      NUXT_PUBLIC_API_BASE: http://api:8080
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks: [ internal ]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  storage_data:

networks:
  internal:
    driver: bridge
