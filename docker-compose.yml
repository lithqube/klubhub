# Development backends: scripts/setup.sh dev
# Host UI: NUXT_PUBLIC_API_BASE=http://127.0.0.1:8080 pnpm nx serve dj --host 0.0.0.0 --port 4200
# API_BIND and S3_BIND control host publication, never container listeners.
# The `app` service is a single Linux container running Go + Nuxt/Node +
# Chromium; dev disables the embedded frontend proxy (`SERVE_FRONTEND=false`)
# so the host Nuxt serves the UI.
name: klubhub-dj-dev

secrets:
  postgres_password:
    file: ${SECRET_DIR:-./secrets/dev}/postgres_password
  garage_rpc_secret:
    file: ${SECRET_DIR:-./secrets/dev}/garage_rpc_secret
  garage_admin_token:
    file: ${SECRET_DIR:-./secrets/dev}/garage_admin_token
  token_encryption_key:
    file: ${SECRET_DIR:-./secrets/dev}/token_encryption_key
  ical_secret:
    file: ${SECRET_DIR:-./secrets/dev}/ical_secret
  s3_access_key:
    file: ${SECRET_DIR:-./secrets/dev}/s3_access_key
  s3_secret_key:
    file: ${SECRET_DIR:-./secrets/dev}/s3_secret_key

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klubhub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-klubhub}
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks: [ internal ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klubhub} -d ${POSTGRES_DB:-klubhub}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  storage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    ports:
      - "${S3_BIND:-127.0.0.1}:${S3_PORT:-39000}:3900"
    volumes:
      - storage_data:/data
      - ${GARAGE_CONFIG_FILE:-./secrets/dev/garage.toml}:/etc/garage.toml:ro
    environment:
      - GARAGE_RPC_SECRET_FILE=/run/secrets/garage_rpc_secret
      - GARAGE_ADMIN_TOKEN_FILE=/run/secrets/garage_admin_token
    secrets:
      - garage_rpc_secret
      - garage_admin_token
    networks: [ internal ]
    # RPC probe works in Garage's shell-free image, before S3 provisioning.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  app:
    # Single Go + Nuxt container. In dev SERVE_FRONTEND=false so the embedded
    # Nuxt is not proxied; the host Nuxt (pnpm nx serve dj --host 0.0.0.0)
    # serves the UI and is reached via host.docker.internal.
    build:
      context: ./api
      dockerfile: Dockerfile
      platforms: [linux/arm64]
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klubhub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-klubhub}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
      S3_ENDPOINT: storage:3900
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:39000}
      S3_BUCKET: ${S3_BUCKET:-klubhub}
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      ICAL_SECRET_FILE: /run/secrets/ical_secret
      BIND_ADDRESS: 0.0.0.0
      SERVE_FRONTEND: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:4200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_SEC: ${SHUTDOWN_TIMEOUT_SEC:-30}
      NUXT_INTERNAL_URL: http://host.docker.internal:4200
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      DISCOGS_API_KEY: ${DISCOGS_API_KEY:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      # Licensed edition features (docs/EDITIONS.md): off unless set in .env.
      # Dev Nuxt runs on the host, so export NUXT_PUBLIC_FEATURES_RA_IMPORT
      # there as well to show the RA UI.
      FEATURE_RA_IMPORT: ${FEATURE_RA_IMPORT:-false}
    secrets:
      - postgres_password
      - token_encryption_key
      - ical_secret
      - s3_access_key
      - s3_secret_key
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    networks: [ internal ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      storage:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/api", "-healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 200

volumes:
  db_data:
  storage_data:

networks:
  internal:
    driver: bridge
