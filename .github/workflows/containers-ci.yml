name: Publish KlubHub DJ container image

on:
  push:
    branches: [main]
    # A v* release tag publishes :<tag> as well (path filters are not
    # evaluated for tag pushes, so every release tag builds).
    tags: ['v*']
    paths:
      - 'apps/dj/**'
      - 'libs/ui/**'
      - 'Dockerfile'
      - '.github/workflows/containers-ci.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Optional tag override (e.g. v1.0.1). Defaults to short commit SHA.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lithqube/klubhub-dj-api

jobs:
  # One native runner per platform (QEMU builds of the Vite client hang,
  # see promoter-ci.yml). Each platform is scanned, then pushed by digest;
  # image-merge tags and signs the combined image. Mirrors promoter-ci.yml.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded locally (not pushed yet) so Trivy scans the exact image
      # before anything reaches the registry.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/dj/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=containers-ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=containers-ci-${{ matrix.arch }}

      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the scanner too: older action defaults point at Trivy
          # releases that have since been removed upstream.
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:scan
          format: spdx-json
          output-file: dj-sbom-${{ matrix.arch }}.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: 'dj-sbom-${{ matrix.arch }}', path: 'dj-sbom-${{ matrix.arch }}.spdx.json' }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged: image-merge publishes the tags once both platforms exist.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/dj/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=containers-ci-${{ matrix.arch }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: dj-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        env:
          TAG_OVERRIDE: ${{ github.event.inputs.tag_override }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "$TAG_OVERRIDE" ]; then
            TAG="$TAG_OVERRIDE"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="sha-${SHORT_SHA}"
          fi
          # Release tags keep the repo's v-prefixed form (docker-compose.prod.yml
          # defaults IMAGE_TAG to one); reject anything else before pushing.
          if [ "$TAG" != "sha-${SHORT_SHA}" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: dj-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${TAG}"
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          tags=(-t "$ref")
          # A release build also gets the sha tag, so scripts/install.sh
          # finds it by commit.
          if [ "$TAG" != "sha-${SHORT_SHA}" ]; then tags+=(-t "${IMAGE}:sha-${SHORT_SHA}"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$ref"
          # Attestation manifests carry platform unknown/unknown; skip them.
          platforms=$(docker buildx imagetools inspect "$ref" --raw \
            | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')
          if [ "$platforms" != "amd64,arm64" ]; then
            echo "::error::$ref has platforms '$platforms', expected amd64,arm64"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the digest of $ref"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $ref"

      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.merge.outputs.digest }}"
