name: Publish KlubHub DJ container image

on:
  push:
    branches: [main]
    paths:
      - 'apps/dj/**'
      - 'Dockerfile'
      - '.github/workflows/containers-ci.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Optional tag override (e.g. v1.0.1). Defaults to short commit SHA.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
          else
            TAG="sha-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/dj/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/lithqube/klubhub-dj-api:${{ steps.tags.outputs.tag }}
          cache-from: type=gha,scope=containers-ci
          cache-to: type=gha,mode=max,scope=containers-ci

      - name: Verify manifest
        env:
          IMAGE: ghcr.io/lithqube/klubhub-dj-api:${{ steps.tags.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          jq -e '
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | .platform] as $p
            | ($p | length) == 1
              and $p[0].os == "linux"
              and $p[0].architecture == "arm64"
          ' manifest.json
          echo "Published $IMAGE"
          cat manifest.json
