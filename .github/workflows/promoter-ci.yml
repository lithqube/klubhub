name: KlubHub Promoter CI

on:
  pull_request:
    paths: &paths
      - 'apps/promoter/**'
      - 'apps/promoter-e2e/**'
      - 'libs/ui/**'
      - 'api/**'
      - 'infra/promoter/**'
      - 'docker-compose.promoter.yml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/promoter-ci.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promoter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/lithqube/klubhub-promoter-api

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Full history. Known historical findings are allowlisted narrowly
      # (commit + path) in .gitleaks.toml, so anything new fails.
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -c .gitleaks.toml

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: vet
        working-directory: api
        run: go vet ./...
      # Includes the RLS and data-class guards, the pool-import guard, the
      # Rego policy tests (opa test via the tester package) and the route
      # coverage check; integration tests use testcontainers (Postgres, NATS).
      - name: test (race, integration)
        working-directory: api
        run: go test -race -count=1 -p 1 ./internal/platform/... ./internal/promoter/... ./cmd/promoter/...
      - name: govulncheck
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/promoter/...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Both apps' tsconfig.json extend the generated .nuxt/tsconfig.json, so
      # vitest can't load any test until Nuxt has generated them. The API
      # base is a placeholder (nothing is built or contacted).
      - name: Generate Nuxt types
        run: |
          pnpm --filter @dev/dj exec nuxt prepare
          pnpm --filter @dev/promoter exec nuxt prepare
        env:
          NUXT_PUBLIC_API_BASE: http://api:8080
      - run: pnpm nx run-many -t lint -p @dev/promoter @dev/promoter-e2e
      - run: pnpm nx typecheck @dev/promoter
      # The shared layer also ships in KlubHub DJ: keep DJ's suite green.
      - run: pnpm nx run-many -t test -p @dev/promoter @dev/ui @dev/dj
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx e2e @dev/promoter-e2e

  image:
    needs: [secrets-scan, go, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/promoter/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=promoter
          cache-to: type=gha,mode=max,scope=promoter
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:scan
          format: spdx-json
          output-file: promoter-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: promoter-sbom, path: promoter-sbom.spdx.json }
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/promoter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=promoter
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign image (keyless, GitHub OIDC)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
