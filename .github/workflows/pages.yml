name: Deploy KlubHub site
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'apps/dj/app/assets/css/styles.css'
      - 'apps/dj/public/fonts/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'apps/dj/app/assets/css/styles.css'
      - 'apps/dj/public/fonts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free static build; do not install the application stack.
      - run: node --test apps/site/site.test.mjs
      - run: node apps/site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
