name: Deploy KlubHub site

# Static GitHub Pages site for klubhub.io. Three independent Plunk
# projects (staging, production, preview) keep a leaked staging key
# from touching the production newsletter list. The public keys are
# read from the GitHub Actions environment secrets at build time; the
# secret keys (sk_*) never enter this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      # The browser-only demo at /demo/ is built from the app (docs/DEMO.md).
      - 'apps/dj/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'libs/ui/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'apps/dj/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'libs/ui/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Browser-only demo of the app (NUXT_DEMO=1 static SPA, docs/DEMO.md),
  # published at https://klubhub.io/demo/. Needs no secrets, so PR runs
  # build it too.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pnpm major as apps/dj/Dockerfile (the repo has no packageManager field).
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # apps/dj/tsconfig.json extends the generated .nuxt/tsconfig.json, so
      # vitest can't load any test until Nuxt has generated it. `nuxt
      # prepare` runs in production mode, which requires an API base; the
      # value is a placeholder (nothing is built or contacted). The root
      # tsconfig.json references apps/promoter too, and the build's TS
      # transform follows those references, so its types must exist as well.
      - name: Generate Nuxt types
        run: |
          pnpm --filter @dev/dj exec nuxt prepare
          pnpm --filter @dev/promoter exec nuxt prepare
        env:
          NUXT_PUBLIC_API_BASE: http://api:8080
      - name: Test demo backend
        run: pnpm --filter @dev/dj exec vitest run tests/demo-backend.test.ts tests/demo-fetch.test.ts tests/finance-mocks.test.ts
      - name: Build demo
        run: node apps/dj/scripts/build-demo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: dist/demo
          if-no-files-found: error
          retention-days: 3
  build:
    needs: demo
    runs-on: ubuntu-latest
    # Bind the build job to the `github-pages` environment so it can
    # read environment secrets (PLUNK_PUBLIC_KEY, _STAGING, _PREVIEW).
    # Inherits any branch / reviewer protection rules configured on
    # the environment. The deploy job below also runs in this
    # environment; binding both keeps the secret-access contract
    # consistent and prevents accidental deploys from forks or
    # unrelated branches.
    #
    # Pull-request runs are NOT bound to the environment. The environment
    # only admits the deployment branch, and a PR runs on refs/pull/N/merge,
    # so binding it made this job fail in ~2s on every PR that touches a
    # watched path ("Branch refs/pull/N/merge is not allowed to deploy to
    # github-pages"). PR runs never needed it: they build with the
    # placeholder key below, cannot read environment secrets, and skip the
    # artifact upload. Push and dispatch runs, and the deploy job, keep the
    # binding and its protection rules unchanged.
    # Note the shape: `cond && 'name' || ''`. The `cond && '' || 'name'` form
    # is a trap, because '' is falsy and it falls through to 'name'.
    environment: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free static build; do not install the application stack.
      - name: Test static site
        run: node --test apps/site/site.test.mjs
        env:
          # Tests inject a fixture public key so the build does not fail
          # closed when this job runs in environments without the real
          # production secret (forks, public PRs from forks).
          PLUNK_PUBLIC_KEY: pk_test_abcd1234abcd1234abcd1234abcd1234
      # The build step needs a real Plunk pk_* from the matching
      # environment secret (production / staging / preview). PR builds
      # cannot read GitHub Actions environment secrets, so they run a
      # smoke build against a clearly-marked preview placeholder
      # instead. Push builds to main require the operator to have
      # configured the secrets; the build script fails closed when the
      # env vars are empty, still equal to the placeholder, or wrong-
      # prefixed (sk_*).
      - name: Build static site (PR preview)
        if: github.event_name == 'pull_request'
        run: node apps/site/build.mjs
        env:
          PLUNK_PUBLIC_KEY: pk_ci_pr_preview_only_do_not_subscribe
      - name: Build static site (push)
        if: github.event_name != 'pull_request'
        run: node apps/site/build.mjs
        env:
          # Production deploys use PLUNK_PUBLIC_KEY from the
          # `github-pages` environment secret. Staging and preview
          # environments override PLUNK_PUBLIC_KEY_STAGING and
          # PLUNK_PUBLIC_KEY_PREVIEW respectively.
          PLUNK_PUBLIC_KEY: ${{ secrets.PLUNK_PUBLIC_KEY }}
          PLUNK_PUBLIC_KEY_STAGING: ${{ secrets.PLUNK_PUBLIC_KEY_STAGING }}
          PLUNK_PUBLIC_KEY_PREVIEW: ${{ secrets.PLUNK_PUBLIC_KEY_PREVIEW }}
      # The site build wipes dist/site, so the demo goes in afterwards.
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: dist/site/demo
      - name: Check demo placement
        run: test -f dist/site/demo/index.html && test -f dist/site/demo/finance/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
