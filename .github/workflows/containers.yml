name: Publish KlubHub image

# Single-image release flow for KlubHub DJ v1.0.0.
#
#   - Triggers: pushes of a `v*` tag (e.g. v0.1.0-rc1, v1.0.0). Tag MUST match
#     vMAJOR.MINOR.PATCH[-pre] and MUST be a descendant of origin/main.
#   - Builds a linux/arm64 image from apps/dj/Dockerfile.
#   - Pushes one package `ghcr.io/<owner>/<repo>:<tag>` derived from the
#     apps/dj project (KlubHub DJ is the first product).
#   - Verifies the published manifest exposes only linux/arm64.
#   - Runs on `ubuntu-24.04-arm` (native arm64 runner, no QEMU emulation).
#
# Container docs: docs/container-images.md
# Release notes:  docs/release-notes/v1.0.0.md
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override release tag (e.g. v0.1.0-rc1). Defaults to the pushed tag or "dev".'
        required: false
        default: ''

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve release tag
        id: tag
        env:
          PUSHED: ${{ github.ref_name }}
          OVERRIDE: ${{ github.event.inputs.tag }}
        run: |
          tag="${OVERRIDE:-$PUSHED}"
          if [ -z "$tag" ]; then tag=dev; fi
          if [ "$tag" != "dev" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "tag $tag does not match vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
          echo "release=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ancestry for tag releases
        if: github.event_name != 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ steps.tag.outputs.release }}
          flavor: latest=false

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/dj/Dockerfile
          push: true
          # KlubHub v1.0.0 ships linux/arm64 only. amd64 will be evaluated
          # post-release; multi-arch via QEMU is intentionally out of scope
          # for the v1.0.0 release. See docs/container-images.md.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Verify published platform
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          jq -e '
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | .platform] as $platforms
            | ($platforms | length) == 1
              and $platforms[0].os == "linux"
              and $platforms[0].architecture == "arm64"
          ' manifest.json
          cat manifest.json
